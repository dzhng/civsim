[package]
name = "campaign"
version = "0.1.0"
edition = "2021"

[dependencies]
contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mapgen = { path = "../mapgen" }
# Test-only: the full-game harness resolves real battles through the sim, and
# names contract types to build results for the fast resolver. Production still
# shares only `contract` with the battle layer.
sim = { path = "../sim" }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Battle Sim</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14161c; }
    #battlefield { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 12px;
      font: 12px/1.5 ui-monospace, Menlo, monospace;
      color: #c8cdd8; background: rgba(10, 12, 16, 0.75);
      padding: 10px 14px; border-radius: 8px; pointer-events: none;
      min-width: 220px;
    }
    #hud .bar {
      height: 6px; background: #2a2e3a; border-radius: 3px; overflow: hidden; margin: 2px 0 6px;
    }
    #hud .bar > div { height: 100%; background: #4caf6d; }
    #help {
      position: fixed; bottom: 12px; left: 12px;
      font: 11px ui-monospace, Menlo, monospace; color: #6b7280;
    }
    #buttons {
      position: fixed; top: 12px; right: 12px; display: flex; gap: 8px;
    }
    #buttons button {
      font: 12px ui-monospace, Menlo, monospace; color: #c8cdd8;
      background: rgba(10,12,16,0.8); border: 1px solid #3a3f4d;
      border-radius: 6px; padding: 6px 12px; cursor: pointer;
    }
    #buttons button:hover { background: rgba(40,44,56,0.9); }
    #manual {
      display: none; position: fixed; top: 56px; right: 12px; z-index: 50;
      width: min(560px, 90vw); max-height: calc(100vh - 80px);
      overflow-y: auto; background: rgba(12,14,19,0.96);
      border: 1px solid #3a3f4d; border-radius: 10px;
      color: #cdd2dd; font: 13px/1.6 -apple-system, sans-serif;
      padding: 12px 22px 22px; z-index: 10;
    }
    #manual h1 { font-size: 19px; } #manual h2 { font-size: 15px; margin-top: 18px; color: #e8d9a8; }
    #manual table { border-collapse: collapse; width: 100%; margin: 6px 0; }
    #manual td, #manual th { border: 1px solid #333947; padding: 3px 8px; font-size: 12px; text-align: left; }
    #banner {
      display: none; position: fixed; top: 38%; left: 0; right: 0;
      text-align: center; font: bold 42px ui-monospace, Menlo, monospace;
      text-shadow: 0 2px 14px rgba(0,0,0,0.9); pointer-events: none;
    }
    #selbox {
      display: none; position: fixed; border: 1px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.08); pointer-events: none;
    }
    #unitlabels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
    #toolbar {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; align-items: center; z-index: 5;
      background: rgba(12,14,19,0.85); border: 1px solid #3a3f4d;
      border-radius: 10px; padding: 7px 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }
    #toolbar button {
      font: 12px ui-monospace, Menlo, monospace; color: #c8cdd8;
      background: rgba(34,38,48,0.9); border: 1px solid #444a5a;
      border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap;
    }
    #toolbar button:hover { background: rgba(56,62,78,0.95); }
    #toolbar button.on { background: #4a6, border-color: #6c8; color: #fff; }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #toolbar .sep { width: 1px; height: 18px; background: #3a3f4d; }
    /* Unit banner: one component = standard (SVG flag) + health/cohesion bars + status chips. */
    .ubanner {
      position: absolute; width: 56px; display: none; will-change: transform;
      flex-direction: column; align-items: center; left: 0; top: 0;
    }
    .ubanner.sel { filter: drop-shadow(0 0 2.5px rgba(255,255,255,0.9)); }
    .ubanner-flag { display: block; width: 56px; height: 24px; overflow: visible; }
    .ubanner.sel .ubanner-flag { transform: scale(1.12); transform-origin: 28px 1px; }
    .ubanner-bars { width: 52px; margin: 0 2px 1px; }
    .ubar { height: 3px; background: rgba(10,10,12,0.55); border-radius: 2px; overflow: hidden; margin-bottom: 1px; }
    .ubar > div { height: 100%; }
    .ubar.coh > div { background: #d9c75a; }
    .ubanner-fx { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; margin-top: 1px; width: 56px; }
    .ubanner-fx b {
      font: 600 7px ui-monospace, Menlo, monospace; color: #e8e4d8;
      background: rgba(14,16,20,0.72); border-radius: 2px; padding: 0 2px;
    }
    .ubanner-fx b.hot { color: #ffc46b; }
    .ubanner-fx b.bad { color: #ff7a6b; }
    /* Standalone visual-regression gallery (?test=banners). */
    #banner-gallery {
      position: fixed; inset: 0; background: #2c3a22; z-index: 50;
      display: flex; flex-wrap: wrap; align-content: flex-start; gap: 22px; padding: 28px;
    }
    #banner-gallery .ubanner-cell {
      width: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 12px 8px;
    }
    #banner-gallery .ubanner-cap { font: 600 10px ui-monospace, Menlo, monospace; color: #cfe0bf; }
    #minimap {
      position: fixed; right: 12px; bottom: 30px;
      border: 1px solid #3a3f4d; border-radius: 6px;
      background: #11141a; cursor: crosshair;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }
    #battle-ui { display: none; }
    #menu-ui {
      display: none; position: fixed; inset: 0; z-index: 20;
      flex-direction: column; align-items: center; gap: 34px;
      overflow-y: auto; padding: 48px 0 64px;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(90, 106, 64, 0.22), transparent 60%),
        radial-gradient(ellipse at 50% 110%, rgba(44, 69, 92, 0.30), transparent 65%),
        #0c0e13;
      color: #c8cdd8; font: 14px ui-monospace, Menlo, monospace;
    }
    #menu-ui h1 {
      margin: 0; font: bold 52px ui-monospace, Menlo, monospace; letter-spacing: 10px;
      color: #e8d9a8; text-shadow: 0 3px 22px rgba(0,0,0,0.9);
      animation: title-glow 5s ease-in-out infinite;
    }
    @keyframes title-glow {
      0%, 100% { text-shadow: 0 3px 22px rgba(0,0,0,0.9); }
      50% { text-shadow: 0 3px 22px rgba(0,0,0,0.9), 0 0 26px rgba(232,217,168,0.28); }
    }
    #menu-ui .tagline { margin: -22px 0 0; color: #6b7280; letter-spacing: 3px; }
    #menu-ui .menu-section {
      display: flex; flex-direction: column; gap: 10px; width: min(380px, 84vw);
      background: rgba(12,14,19,0.82); border: 1px solid #3a3f4d; border-radius: 12px;
      padding: 16px 20px 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    }
    /* The campaign is the marquee mode — give it a warm accent. */
    #menu-ui .menu-section.feature {
      border-color: #6a6446;
      box-shadow: 0 8px 34px rgba(60,52,28,0.4), inset 0 0 0 1px rgba(232,217,168,0.05);
    }
    #menu-ui .menu-section.feature h2 { color: #c9b88a; border-bottom-color: #45402c; }
    #menu-ui .section-hint { margin: -4px 0 2px; color: #6b7280; font-size: 11px; letter-spacing: 0.5px; }
    #menu-ui h2 {
      margin: 0 0 4px; font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
      color: #8a9099; border-bottom: 1px solid #2a2e3a; padding-bottom: 8px;
    }
    #menu-ui button {
      font: 16px ui-monospace, Menlo, monospace; color: #d8dde8; text-align: left;
      background: rgba(34,38,48,0.9); border: 1px solid #444a5a;
      border-radius: 8px; padding: 13px 18px; cursor: pointer;
      transition: background 0.13s ease, border-color 0.13s ease, transform 0.08s ease;
    }
    #menu-ui button:hover:not(:disabled) {
      background: rgba(64,72,92,0.95); border-color: #6f7a96; transform: translateY(-1px);
    }
    #menu-ui button:active:not(:disabled) { transform: translateY(0); }
    #menu-ui button:disabled { opacity: 0.4; cursor: default; }
    #menu-ui button small { color: #8a9099; float: right; font-size: 11px; line-height: 20px; }
    #menu-ui .duel-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #menu-ui .duel-vs { color: #6b7280; font-size: 12px; }
    #menu-ui select {
      flex: 1; background: rgba(40,46,60,0.95); color: #cfd6e4; border: 1px solid #4a5268;
      border-radius: 4px; padding: 6px 8px; font: inherit;
    }
    #menu-ui .duel-ai { display: block; color: #8a9099; font-size: 12px; margin: 0 0 8px 2px; cursor: pointer; }
    #gameover {
      display: none; position: absolute; inset: 0; z-index: 30;
      background: rgba(8,10,14,0.55); align-items: center; justify-content: center;
    }
    #gameover .panel {
      background: rgba(22,26,34,0.97); border: 1px solid #4a5268; border-radius: 10px;
      padding: 28px 36px; text-align: center; min-width: 280px;
    }
    #gameover h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: 4px; }
    #gameover p { margin: 0 0 18px; color: #8a9099; font-size: 13px; }
    #gameover button {
      display: block; width: 100%; margin: 6px 0; padding: 9px 14px; cursor: pointer;
      background: rgba(48,54,70,0.95); color: #cfd6e4; border: 1px solid #4a5268;
      border-radius: 6px; font: inherit;
    }
    #gameover button:hover { background: rgba(64,72,92,0.95); border-color: #6f7a96; }
    #gameover .watch { background: none; border: none; color: #6b7280; font-size: 12px; margin-top: 10px; }
    #duel-modal, #pausemenu {
      display: none; position: fixed; inset: 0; z-index: 40;
      background: rgba(8,10,14,0.6); align-items: center; justify-content: center;
      font: 14px ui-monospace, Menlo, monospace;
    }
    #duel-modal .panel, #pausemenu .panel {
      background: rgba(22,26,34,0.97); border: 1px solid #4a5268; border-radius: 10px;
      padding: 26px 32px; min-width: 320px; color: #c8cdd8;
    }
    #duel-modal h2, #pausemenu h2 { margin: 0 0 16px; font-size: 16px; letter-spacing: 3px; color: #aeb6c6; }
    #duel-modal button, #pausemenu button {
      display: block; width: 100%; margin: 8px 0 0; padding: 9px 14px; cursor: pointer;
      background: rgba(48,54,70,0.95); color: #cfd6e4; border: 1px solid #4a5268;
      border-radius: 6px; font: inherit; text-align: center;
    }
    #duel-modal button:hover, #pausemenu button:hover { background: rgba(64,72,92,0.95); border-color: #6f7a96; }
    #duel-modal .cancel, #pausemenu .watch { background: none; border: none; color: #6b7280; font-size: 12px; }
    #duel-modal .duel-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    #duel-modal .duel-vs { color: #6b7280; font-size: 12px; }
    #duel-modal select {
      flex: 1; background: rgba(40,46,60,0.95); color: #cfd6e4; border: 1px solid #4a5268;
      border-radius: 4px; padding: 6px 8px; font: inherit;
    }
    #duel-modal .duel-ai { display: block; color: #8a9099; font-size: 12px; margin: 2px 0 6px 2px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="manual"></div>
  <div id="menu-ui">
    <h1>BATTLE SIM</h1>
    <p class="tagline">mass &middot; momentum &middot; morale</p>
    <div class="menu-section feature">
      <h2>Campaign</h2>
      <p class="section-hint">Six powers, real-time. Wage war, forge alliances, gang up on the strong.</p>
      <button id="menu-new-campaign">New Campaign <small>conquer the ancient world</small></button>
      <button id="menu-load-save">Load Save <small>resume your war</small></button>
    </div>
    <div class="menu-section">
      <h2>Quick Battle</h2>
      <button id="menu-1v1">1v1 Duel <small>you pick the matchup</small></button>
      <button data-battle="5v5">Clash of Arms <small>full roster, open field</small></button>
      <button data-battle="mapA">Map A: Ridge</button>
      <button data-battle="mapB">Map B: Meeting</button>
    </div>
    <div class="menu-section">
      <button id="menu-manual">Field Manual</button>
    </div>
    <div id="duel-modal">
      <div class="panel">
        <h2>1v1 DUEL</h2>
        <div class="duel-row">
          <select id="duel-a"></select>
          <span class="duel-vs">vs</span>
          <select id="duel-b"></select>
        </div>
        <label class="duel-ai"><input type="checkbox" id="duel-ai"> enemy AI commander</label>
        <button id="menu-duel">Fight</button>
        <button class="cancel" id="duel-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <div id="battle-ui">
  <canvas id="battlefield"></canvas>
  <div id="gameover">
    <div class="panel">
      <h2 id="gameover-title">VICTORY</h2>
      <p id="gameover-sub"></p>
      <button id="gameover-restart">Restart Battle</button>
      <button id="gameover-menu">Main Menu</button>
      <button class="watch" id="gameover-watch">keep watching the field</button>
    </div>
  </div>
  <div id="hud">loading wasm…</div>
  <div id="buttons">
    <button id="btn-menu">Menu</button>
  </div>
  <div id="pausemenu">
    <div class="panel">
      <h2>MENU</h2>
      <button id="pause-restart">Restart Battle</button>
      <button id="pause-manual">Field Manual</button>
      <button id="pause-exit">Exit to Main Menu</button>
      <button class="watch" id="pause-close">back to the field</button>
    </div>
  </div>
  <div id="banner"></div>
  <div id="selbox"></div>
  <canvas id="minimap" width="240" height="160"></canvas>
  <div id="unitlabels"></div>
  <div id="toolbar">
    <button data-cmd="pace" title="Hotkey: R&#10;Toggle walk/run. Running is ~2x speed but burns stamina in ~90s and the formation frays the longer it runs — walk to arrive in order.">Run</button>
    <button data-cmd="reform" title="Hotkey: G&#10;Halt and re-dress the ranks at double recovery speed (the sergeants shout). Use after a scramble, a defile, or a melee.">Reform</button>
    <button data-cmd="pursue" title="Hotkey: H&#10;ON: an advance auto-attacks any enemy within a 5s run and chases routers — the chase gives up once it is measurably losing ground. OFF: fight whatever is in reach but keep marching to your destination.">Pursue</button>
    <button data-cmd="fire" title="Hotkey: V&#10;Missile troops loose on judgment (captains still hold fire into melees involving OTHER friendly units). OFF: hold every shot. Missile units only.">Fire</button>
    <button data-cmd="weapon" title="Hotkey: X&#10;Draw secondaries unit-wide: ~1s for the order to travel (orange pie), then each man swaps with a ~1s fumble. Phalanx grounds pikes for side swords; archers sling bows (no shooting). Units with a sidearm or bow only.">2nd Weapon</button>
    <button data-cmd="kite" title="Hotkey: E&#10;Skirmish reflex: automatically hop away from approaching enemies and keep shooting — the fighting retreat. Skirmishers and horse archers only.">Kite</button>
    <span class="sep"></span>
    <button data-cmd="pause" title="Pause (P)">⏸</button>
    <button data-cmd="x1" title="Normal speed (1)">1×</button>
    <button data-cmd="x3" title="Fast forward (3)">3×</button>
    <span class="sep"></span>
    <button data-cmd="paths" title="Show paths and destination ghosts (hold Space)">Paths</button>
  </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
